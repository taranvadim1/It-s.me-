name: Import project ZIP

on:
  push:
    paths:
      - 'itsme-app.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          unzip -o itsme-app.zip -d temp
          cp -R temp/. .
          rm -rf temp itsme-app.zip

      - name: Сохранить проект
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import itsme project source" || exit 0
          git push
